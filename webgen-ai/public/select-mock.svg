<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#0b1020"/>
			<stop offset="100%" stop-color="#111a33"/>
		</linearGradient>
		<linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#131c36"/>
			<stop offset="100%" stop-color="#0f1730"/>
		</linearGradient>
		<style>
			.text{ fill:#e6edf3; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial; }
			.muted{ fill:#b9c2cf; }
		</style>
	</defs>
	<rect width="1600" height="900" fill="url(#bg)"/>

	<text x="200" y="160" class="text" font-size="36" font-weight="700">Choose a project type</text>
	<text x="200" y="196" class="text muted" font-size="16">Your prompt will be tailored for the selected framework.</text>

	<!-- Tiles grid -->
	<g transform="translate(200,240)">
		<rect width="260" height="160" rx="16" fill="url(#tile)" stroke="#2a2f45"/>
		<text x="20" y="44" class="text" font-size="18" font-weight="600">Static</text>
		<text x="20" y="70" class="text muted" font-size="14">HTML/CSS/JS</text>
	</g>
	<g transform="translate(480,240)">
		<rect width="260" height="160" rx="16" fill="url(#tile)" stroke="#2a2f45"/>
		<text x="20" y="44" class="text" font-size="18" font-weight="600">React</text>
		<text x="20" y="70" class="text muted" font-size="14">Vite SPA</text>
	</g>
	<g transform="translate(760,240)">
		<rect width="260" height="160" rx="16" fill="url(#tile)" stroke="#2a2f45"/>
		<text x="20" y="44" class="text" font-size="18" font-weight="600">Vue</text>
		<text x="20" y="70" class="text muted" font-size="14">Vite SPA</text>
	</g>
	<g transform="translate(1040,240)">
		<rect width="260" height="160" rx="16" fill="url(#tile)" stroke="#2a2f45"/>
		<text x="20" y="44" class="text" font-size="18" font-weight="600">Angular</text>
		<text x="20" y="70" class="text muted" font-size="14">Lite preview</text>
	</g>
	<g transform="translate(200,420)">
		<rect width="260" height="160" rx="16" fill="url(#tile)" stroke="#2a2f45"/>
		<text x="20" y="44" class="text" font-size="18" font-weight="600">Next.js</text>
		<text x="20" y="70" class="text muted" font-size="14">Static preview</text>
	</g>

</svg>
