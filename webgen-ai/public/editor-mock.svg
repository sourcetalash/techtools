<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#0b1020"/>
			<stop offset="100%" stop-color="#111a33"/>
		</linearGradient>
		<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#131c36"/>
			<stop offset="100%" stop-color="#0f1730"/>
		</linearGradient>
		<style>
			.text{ fill:#e6edf3; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial; }
			.muted{ fill:#b9c2cf; }
		</style>
	</defs>
	<rect width="1600" height="900" fill="url(#bg)"/>
	<!-- Header -->
	<rect x="40" y="40" width="1520" height="60" rx="12" fill="url(#panel)" stroke="#2a2f45"/>
	<text x="70" y="78" class="text" font-size="20" font-weight="600">Editor</text>
	<text x="150" y="78" class="text muted" font-size="14">REACT · ready</text>
	<rect x="1340" y="52" width="90" height="36" rx="8" fill="#1f2a4d" stroke="#2a2f45"/>
	<text x="1365" y="75" class="text" font-size="13">Download</text>
	<rect x="1442" y="52" width="90" height="36" rx="8" fill="#1f2a4d" stroke="#2a2f45"/>
	<text x="1460" y="75" class="text" font-size="13">Capture UI</text>

	<!-- Main area -->
	<g transform="translate(40,120)">
		<!-- Explorer -->
		<rect width="280" height="600" rx="12" fill="url(#panel)" stroke="#2a2f45"/>
		<text x="16" y="30" class="text muted" font-size="13">Explorer</text>
		<!-- Tree items -->
		<circle cx="20" cy="60" r="4" fill="#6aa7ff"/>
		<text x="32" y="64" class="text" font-size="13">index.html</text>
		<circle cx="20" cy="92" r="4" fill="#6aa7ff"/>
		<text x="32" y="96" class="text" font-size="13">src/</text>
		<circle cx="40" cy="124" r="3" fill="#9bc1ff"/>
		<text x="52" y="128" class="text muted" font-size="13">main.tsx</text>
		<circle cx="40" cy="156" r="3" fill="#9bc1ff"/>
		<text x="52" y="160" class="text muted" font-size="13">App.tsx</text>
	</g>

	<!-- Code editor -->
	<g transform="translate(340,120)">
		<rect width="760" height="600" rx="12" fill="url(#panel)" stroke="#2a2f45"/>
		<!-- Editor toolbar -->
		<rect x="0" y="0" width="760" height="40" rx="12" fill="#172447"/>
		<text x="16" y="26" class="text muted" font-size="13">/src/App.tsx</text>
		<rect x="600" y="8" width="60" height="24" rx="6" fill="#1f2a4d" stroke="#2a2f45"/>
		<text x="615" y="25" class="text" font-size="12">Format</text>
		<rect x="666" y="8" width="36" height="24" rx="6" fill="#1f2a4d" stroke="#2a2f45"/>
		<text x="676" y="25" class="text" font-size="12">Wrap</text>
		<rect x="706" y="8" width="44" height="24" rx="6" fill="#1f2a4d" stroke="#2a2f45"/>
		<text x="716" y="25" class="text" font-size="12">Dark</text>
		<!-- Code lines -->
		<g transform="translate(16,56)">
			<rect x="0" y="0" width="300" height="14" rx="3" fill="#2a3a6b"/>
			<rect x="0" y="26" width="540" height="14" rx="3" fill="#2a3a6b"/>
			<rect x="0" y="52" width="460" height="14" rx="3" fill="#2a3a6b"/>
			<rect x="0" y="78" width="520" height="14" rx="3" fill="#2a3a6b"/>
			<rect x="0" y="104" width="380" height="14" rx="3" fill="#2a3a6b"/>
			<rect x="0" y="130" width="600" height="14" rx="3" fill="#2a3a6b"/>
		</g>
	</g>

	<!-- Preview -->
	<g transform="translate(1120,120)">
		<rect width="420" height="600" rx="12" fill="url(#panel)" stroke="#2a2f45"/>
		<text x="16" y="30" class="text muted" font-size="13">Preview</text>
		<g transform="translate(16,56)">
			<rect x="0" y="0" width="300" height="28" rx="8" fill="#24407d"/>
			<rect x="0" y="44" width="360" height="14" rx="5" fill="#20386f"/>
			<rect x="0" y="66" width="320" height="14" rx="5" fill="#20386f"/>
			<rect x="0" y="102" width="380" height="120" rx="12" fill="#1d2e5c"/>
			<rect x="0" y="236" width="380" height="120" rx="12" fill="#1d2e5c"/>
		</g>
	</g>

	<!-- Chat sidebar -->
	<g transform="translate(1120,740)">
		<rect x="-780" y="0" width="1320" height="120" rx="12" fill="url(#panel)" stroke="#2a2f45"/>
		<text x="-760" y="34" class="text muted" font-size="13">Chat</text>
		<rect x="-720" y="16" width="1040" height="36" rx="8" fill="#0e152b" stroke="#2a2f45"/>
		<rect x="336" y="16" width="100" height="36" rx="8" fill="#1f2a4d" stroke="#2a2f45"/>
		<text x="368" y="39" class="text" font-size="13">Send</text>
	</g>
</svg>
