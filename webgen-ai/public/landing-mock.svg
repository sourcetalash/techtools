<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#0b1020"/>
			<stop offset="100%" stop-color="#111a33"/>
		</linearGradient>
		<linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#131c36"/>
			<stop offset="100%" stop-color="#0f1730"/>
		</linearGradient>
		<style>
			.text{ fill:#e6edf3; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial; }
			.muted{ fill:#b9c2cf; }
		</style>
	</defs>
	<rect width="1600" height="900" fill="url(#bg)"/>

	<!-- Top nav -->
	<g transform="translate(40,36)">
		<rect width="1520" height="64" rx="14" fill="url(#card)" stroke="#2a2f45"/>
		<text x="24" y="40" class="text" font-size="20" font-weight="600">WebGen AI</text>
		<text x="1360" y="40" class="text muted" font-size="14">Docs</text>
		<text x="1416" y="40" class="text muted" font-size="14">GitHub</text>
		<rect x="1468" y="18" width="120" height="32" rx="8" fill="#1f2a4d" stroke="#2a2f45"/>
		<text x="1500" y="40" class="text" font-size="13">Get Started</text>
	</g>

	<!-- Hero -->
	<g transform="translate(160,160)">
		<text x="0" y="0" class="text" font-size="56" font-weight="700">Generate modern websites with AI</text>
		<text x="0" y="40" class="text muted" font-size="18">Describe your idea. Choose a framework. Edit with live preview.</text>
		<!-- Prompt card -->
		<g transform="translate(0,84)">
			<rect width="1280" height="200" rx="16" fill="url(#card)" stroke="#2a2f45"/>
			<text x="24" y="48" class="text muted" font-size="14">Prompt</text>
			<rect x="20" y="64" width="1000" height="96" rx="10" fill="#0e152b" stroke="#2a2f45"/>
			<text x="32" y="96" class="text muted" font-size="14">e.g., A vibrant SaaS landing page with hero, features, pricing, and contact</text>
			<rect x="1040" y="64" width="220" height="96" rx="10" fill="#2b5bd7"/>
			<text x="1114" y="118" class="text" font-size="18" font-weight="600">Next</text>
		</g>
		<!-- Highlights -->
		<g transform="translate(0,320)">
			<rect width="400" height="140" rx="14" fill="url(#card)" stroke="#2a2f45"/>
			<rect x="24" y="28" width="120" height="12" rx="6" fill="#2a3a6b"/>
			<rect x="24" y="50" width="220" height="12" rx="6" fill="#2a3a6b"/>
		</g>
		<g transform="translate(440,320)">
			<rect width="400" height="140" rx="14" fill="url(#card)" stroke="#2a2f45"/>
			<rect x="24" y="28" width="120" height="12" rx="6" fill="#2a3a6b"/>
			<rect x="24" y="50" width="220" height="12" rx="6" fill="#2a3a6b"/>
		</g>
		<g transform="translate(880,320)">
			<rect width="400" height="140" rx="14" fill="url(#card)" stroke="#2a2f45"/>
			<rect x="24" y="28" width="120" height="12" rx="6" fill="#2a3a6b"/>
			<rect x="24" y="50" width="220" height="12" rx="6" fill="#2a3a6b"/>
		</g>
	</g>
</svg>
